<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" font-family="'PingFang SC','Noto Sans CJK SC',sans-serif">
<rect width="680" height="400" fill="#F7F7F5"/>
