<path d="M434 300H420" marker-end="url(#a-blue)"/>
<path d="M486 300H500" marker-end="url(#a-blue)"/>
</g>
<text x="460" y="366" font-size="12" fill="#185FA5" text-anchor="middle">靶车 4 块装甲 · 法线朝外（俯视）</text>

<path d="M140 300L322 195" fill="none" stroke="#A32D2D" stroke-width="2" marker-end="url(#a-red)"/>
<path d="M140 300L235 245" fill="none" stroke="#A32D2D" stroke-width="2" marker-end="url(#a-red)"/>
<path d="M140 300L95 222" fill="none" stroke="#3B6D11" stroke-width="2" marker-end="url(#a-green)"/>
<text x="240" y="240" font-size="12" font-weight="500" fill="#A32D2D">x_G（云台前向）</text>
<text x="60" y="212" font-size="12" font-weight="500" fill="#3B6D11">y_G</text>

<path d="M184 300L183.1 292.5L180.6 285.4L176.6 278.9L171.2 273.3L164.6 268.9L157 266" fill="none" stroke="#888780" stroke-width="0.8"/>
<text x="190" y="288" font-size="12" fill="#5F5E5A">yaw = +30°（左正）</text>

<text x="330" y="168" font-size="12" fill="#5F5E5A">G 系绕 z 转过的角度 = 云台 yaw</text>

<g font-size="11">
<path d="M40 356H72" stroke="#444441" stroke-width="1.2"/>
<text x="78" y="360" fill="#444441">O 系（odom）：不随云台转</text>
<path d="M40 380H72" stroke="#A32D2D" stroke-width="2"/>
