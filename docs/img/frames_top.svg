<path d="M80 60H640M80 140H640M80 220H640M80 300H640"/>
<path d="M160 40V360M240 40V360M320 40V360M400 40V360M480 40V360M560 40V360"/>
</g>
<text x="24" y="28" font-size="14" font-weight="500" fill="#2C2C2A">图 1　俯视图：O 系固定不动，G 系跟着 yaw 一起转</text>

<defs>
<marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#444441" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="a-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#A32D2D" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="a-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#3B6D11" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#185FA5" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<path d="M140 300H618" fill="none" stroke="#444441" stroke-width="1.2" marker-end="url(#a-gray)"/>
<path d="M140 300V74" fill="none" stroke="#444441" stroke-width="1.2" marker-end="url(#a-gray)"/>
<text x="510" y="290" font-size="12" fill="#444441">x_O　前</text>
<text x="148" y="72" font-size="12" fill="#444441">y_O　左（+z 垂直纸面向外）</text>
<circle cx="140" cy="300" r="3.5" fill="#444441"/>
<text x="118" y="322" font-size="12" font-weight="500" fill="#2C2C2A">O 原点</text>

<circle cx="460" cy="300" r="26" fill="none" stroke="#185FA5" stroke-width="0.8" stroke-dasharray="3 3"/>
<g stroke="#185FA5" stroke-width="2.5">
<path d="M447 274H473"/><path d="M447 326H473"/><path d="M434 287V313"/><path d="M486 287V313"/>
</g>
